name: CI

on:
    pull_request: ~
    push:
        branches:
            - '*'
        tags:
            - '*'

jobs:
    cs:
        name: Coding Style
        runs-on: ubuntu-latest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install ecs
                run: composer update --working-dir=tools/ecs --no-interaction --no-progress

            -   name: Check the coding style
                run: composer cs-check

    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ 8.4, 8.5 ]
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, pcre, pdo_mysql, zlib
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            # The Font Awesome Pro component is a private package and cannot be installed in the CI.
            -   name: Install the dependencies
                run: |
                    composer remove markocupic/contao-component-fontawesome-pro --no-update --no-interaction
                    composer update --no-interaction --no-progress

            -   name: Run the unit tests
                run: composer unit-tests

